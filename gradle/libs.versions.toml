[versions]
# 9.5.0, the newest stable AGP. It requires Gradle 9.6.0 minimum, which the
# wrapper satisfies at 9.7.0.
#
# This is not independent of the Gradle version. AGP checks the Gradle it is
# running on and fails the build if it is too old, so the two move together -
# see gradle/wrapper/gradle-wrapper.properties. It is also the reason a failure
# here would surface as an unhelpful "AAR metadata" or "minimum Gradle" message
# rather than pointing at this line.
#
# The wrapper stops at 9.7.0 rather than the newest Gradle (9.8.1): Kotlin
# 2.4.21's Gradle plugin is only verified through Gradle 9.7.0, and AGP 9.5's
# own floor is 9.6.0, so 9.7.0 is the one version inside both.
#
# AGP 9.5 supports API 37 as a ceiling; compileSdk stays 36.1 because moving it
# is a separate, coordinated decision - see the note on material3 below.
agp = "9.5.0"
# 1.19.1, newest stable. `core` is the conservative half of AndroidX and does
# not ride the Compose line, so it is safe to move on its own.
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# NOT bumped, deliberately. activity and lifecycle are Compose-adjacent -
# activity-compose and lifecycle-runtime-compose pull the Compose line in - so
# their newest releases ride the same compileSdk 37 floor as the BOM below and
# have to move as one with it rather than independently.
lifecycleRuntimeKtx = "2.8.7"
lifecycleViewmodelCompose = "2.8.7"
lifecycleRuntimeCompose = "2.8.7"
activityCompose = "1.10.1"
# 2.4.21, the newest stable. The Compose compiler plugin below is versioned
# from this same key, so it moves in lockstep and there is nothing to keep in
# step by hand.
kotlin = "2.4.21"
# 2025.11.01 is the first BOM that resolves androidx.compose.material3 to
# 1.4.0 - the first stable Material 3 Expressive release.
#
# NOT bumped to the current BOM (2026.08.00) here, and the reason is a hard
# floor rather than caution: every Compose BOM from 2026.04 onward resolves the
# core Compose libraries to the 1.11/1.12 line, which requires compileSdk 37,
# while this app compiles against 36.1. Raising the BOM alone fails the AAR
# metadata check. The BOM, material3 and compileSdk are one coordinated move
# that has to be verified by a real build (see AGENTS.md §4), so they are left
# together until that build can run.
composeBom = "2025.11.01"
# 1.4.0 stable ships the *theming* half of Expressive (MaterialExpressiveTheme,
# MotionScheme, MaterialShapes) but not the component set. LoadingIndicator,
# ContainedLoadingIndicator, the Wavy*ProgressIndicators, SplitButton and the
# morphing ButtonGroup are only in 1.5.0-alpha, so material3 is pinned above the
# BOM deliberately. The BOM still governs everything else in the Compose stack.
#
# alpha14 specifically, not a later alpha: from alpha16 onward material3 depends
# on Compose UI 1.11+ / 1.12+, which require compileSdk 37. This app compiles
# against 36.1, so every later alpha fails AAR metadata checking. alpha14 is the
# newest one still on the Compose 1.8 line.
#
# Verified by extracting each artifact and compiling against the real signatures,
# not by reading release notes.
#
# Still alpha14 by that same rule: the 1.5.0 line has since reached beta01 (Oct
# 2026), but it sits above the same compileSdk 37 floor and is not reachable
# from 36.1 either, so there is nothing newer to move to in this change.
material3 = "1.5.0-alpha14"
# KSP2's own versioning, which since 2.3.0 is decoupled from the Kotlin version
# above - it is not the old `2.2.10-2.0.2` shape. That is why this is safe to
# move independently, and also why it is worth noticing if it ever goes back to
# being pinned to a Kotlin version: the two would have to be read together
# again.
googleDevtoolsKsp = "2.3.12"
# NOT bumped. navigation-compose is built on the Compose line, so its newest
# releases share the compileSdk 37 floor with the BOM above and cannot move
# independently of it.
navigationCompose = "2.8.9"
# 1.11.0, newest stable. The core/android/test artifacts below are all the same
# release line and are bumped together.
kotlinxCoroutinesTest = "1.11.0"
core = "1.6.1"
runner = "1.6.2"
# NOT bumped to Coil 3.x, because that is a migration rather than a version
# bump: the group changes to `io.coil-kt.coil3`, every `coil.*` package becomes
# `coil3.*` across ~25 files, core no longer ships a network fetcher (so it also
# needs `coil-network-okhttp`), and `ImageLoaderFactory` becomes
# `SingletonImageLoader.Factory`. That has to be compiled to be trusted, so it
# is kept out of a version sweep.
coilCompose = "2.7.0"
# 3.0.0, newest stable. Retrofit 3 keeps the `com.squareup.retrofit2` coordinates
# and its release notes state forward binary compatibility with 2.x, so the
# service interfaces and the Moshi converter factory are unchanged.
retrofit = "3.0.0"
converterMoshi = "3.0.0"
kotlinxCoroutinesAndroid = "1.11.0"
kotlinxCoroutinesCore = "1.11.0"
# 5.5.0, newest stable. OkHttp 5 keeps the `com.squareup.okhttp3` coordinates
# and Gradle module metadata now selects the Android or JVM variant
# automatically, so no artifact name changes. It is a new major, so this is the
# one networking bump worth a build: Retrofit 3.0.0 still declares OkHttp 4.12
# as its published baseline and neither project's notes say the pairing was
# tested, so treat the two as an unverified pair.
loggingInterceptor = "5.5.0"
okhttp = "5.5.0"
moshiKotlin = "1.15.2"
moshiKotlinCodegen = "1.15.2"
# 1.2.1, newest stable on the 1.2 line.
datastorePreferences = "1.2.1"
# 1.10.0, newest stable.
browser = "1.10.0"
# 4.17, newest stable. Test-only. Its release notes flag changes to
# `AndroidVersions` and `ShadowCameraCharacteristics.set`, neither of which this
# suite touches, and note that JDK 17+ may need JVM flags.
robolectric = "4.17"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# Backs MaterialShapes.toShape/toPath - the morphing polygons the Expressive
# loading indicators and buttons animate between. Material3 1.5 pulls it in
# transitively; depending on it directly is what makes the graphics-shapes types
# in our own signatures resolvable.
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version = "1.0.1" }
# `coil-gif` used to be declared here, for the `GifDecoder` fallback that
# existed because `ImageDecoder` needs API 28. `minSdk` is 31, so the fallback
# was unreachable on every device this app can be installed on while still
# packaging the artifact - the animated WebP/GIF/APNG decoding the app actually
# needs comes from the platform decoder registered in `NetworkClient`. Removed
# rather than left declared; do not re-add it without a device below API 28.
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "converterMoshi" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshiKotlin" }
moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshiKotlinCodegen" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "googleDevtoolsKsp" }
