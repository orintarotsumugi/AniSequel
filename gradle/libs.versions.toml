[versions]
# 9.4.1, the newest *stable* AGP. 9.5.0 exists only as alpha09 at the time of
# writing, and an alpha build system is a different decision from an alpha UI
# library: material3 above is pinned to an alpha deliberately and for a written
# reason, whereas this one gates every build the project makes.
#
# **There is still no stable 9.5.0, and this was proven rather than assumed.** A
# change briefly moved this pin to `9.5.0` on the belief that the line had gone
# stable; CI answered, on 2026-10-15, with
#
#     Plugin [id: 'com.android.application', version: '9.5.0', apply: false]
#     was not found in any of the following sources: ... Google, MavenRepo,
#     Gradle Central Plugin Repository
#
# and Google's own repository metadata still reports
# `<latest>9.5.0-alpha10</latest>`. The build stops at configuration time, so
# the failure is at least loud and immediate - but it stops *every* task,
# including the sibling dependency bumps in the same change, which never got to
# be resolved at all. Do not raise this pin without resolving it first.
#
# This is not independent of the Gradle version. AGP checks the Gradle it is
# running on and fails the build if it is too old, so the two move together -
# see gradle/wrapper/gradle-wrapper.properties. It is also the reason a failure
# here would surface as an unhelpful "AAR metadata" or "minimum Gradle" message
# rather than pointing at this line.
agp = "9.4.1"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.8.7"
lifecycleViewmodelCompose = "2.8.7"
lifecycleRuntimeCompose = "2.8.7"
activityCompose = "1.10.1"
# 2.4.21, the newest stable. The Compose compiler plugin below is versioned
# from this same key, so it moves in lockstep and there is nothing to keep in
# step by hand.
kotlin = "2.4.21"
# 2025.11.01 is the first BOM that resolves androidx.compose.material3 to
# 1.4.0 - the first stable Material 3 Expressive release.
composeBom = "2025.11.01"
# 1.4.0 stable ships the *theming* half of Expressive (MaterialExpressiveTheme,
# MotionScheme, MaterialShapes) but not the component set. LoadingIndicator,
# ContainedLoadingIndicator, the Wavy*ProgressIndicators, SplitButton and the
# morphing ButtonGroup are only in 1.5.0-alpha, so material3 is pinned above the
# BOM deliberately. The BOM still governs everything else in the Compose stack.
#
# alpha14 specifically, not a later alpha: from alpha16 onward material3 depends
# on Compose UI 1.11+ / 1.12+, which require compileSdk 37. This app compiles
# against 36.1, so every later alpha fails AAR metadata checking. alpha14 is the
# newest one still on the Compose 1.8 line.
#
# Verified by extracting each artifact and compiling against the real signatures,
# not by reading release notes.
material3 = "1.5.0-alpha14"
# KSP2's own versioning, which since 2.3.0 is decoupled from the Kotlin version
# above - it is not the old `2.2.10-2.0.2` shape. That is why this is safe to
# move independently, and also why it is worth noticing if it ever goes back to
# being pinned to a Kotlin version: the two would have to be read together
# again.
googleDevtoolsKsp = "2.3.12"
navigationCompose = "2.8.9"
kotlinxCoroutinesTest = "1.10.2"
core = "1.6.1"
runner = "1.6.2"
coilCompose = "2.7.0"
retrofit = "2.12.0"
converterMoshi = "2.12.0"
kotlinxCoroutinesAndroid = "1.10.2"
kotlinxCoroutinesCore = "1.10.2"
loggingInterceptor = "4.10.0"
okhttp = "4.12.0"
moshiKotlin = "1.15.2"
moshiKotlinCodegen = "1.15.2"
datastorePreferences = "1.1.7"
browser = "1.8.0"
robolectric = "4.16.1"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# Backs MaterialShapes.toShape/toPath - the morphing polygons the Expressive
# loading indicators and buttons animate between. Material3 1.5 pulls it in
# transitively; depending on it directly is what makes the graphics-shapes types
# in our own signatures resolvable.
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version = "1.0.1" }
# `coil-gif` must stay, and this is worth knowing before anyone "tidies" it
# away: it is not the GIF-only artifact its name suggests. **Both**
# `coil.decode.ImageDecoderDecoder` - the decoder `NetworkClient` registers, and
# the only one that can run on this app's `minSdk = 31` - and the older
# `coil.decode.GifDecoder` live in it. A change removed it on the belief that
# `ImageDecoderDecoder` belonged to coil-base, and CI answered with
# "Unresolved reference 'ImageDecoderDecoder'" at the import. Verified against
# the published artifact rather than a release note:
# `coil-gif-2.7.0.aar` contains `coil/decode/ImageDecoderDecoder.class`;
# `coil-base-2.7.0.aar` contains neither decoder.
#
# The unreachable `GifDecoder` fallback is gone from the code, so R8 prunes its
# classes - but the artifact itself is load-bearing.
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }
coil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coilCompose" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "converterMoshi" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshiKotlin" }
moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshiKotlinCodegen" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "googleDevtoolsKsp" }
