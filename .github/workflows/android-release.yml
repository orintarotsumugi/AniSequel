name: Android Build, Lint & Automated GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    # The manifest-sync step commits update.json back to main; skip the full
    # APK build for that commit so publishing a release cannot loop.
    #
    # Note that this list is belt-and-braces rather than the actual guard. The
    # sync step pushes with GITHUB_TOKEN, and GitHub deliberately does not start
    # workflow runs for pushes made with that token - which is why no run exists
    # for any "Update manifest for v..." commit. update.json alone would cover
    # it; gradle.properties and app/build.gradle.kts are NOT listed, because they
    # are ordinary source files that a human may legitimately change, and a
    # filter that skips a real build is a worse bug than the loop it prevents.
    paths-ignore:
      - 'update.json'
      - '**.md'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  # Only for the "tell reviewers where the APK is" comment below. Scoped to
  # pull-requests so it cannot be used to touch issues or reviews.
  pull-requests: write

# Two pushes landing together would both mint a release tag and race to write
# update.json. Serialising per ref keeps the newest run the one that publishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APKs, Bug Check & Release
    runs-on: ubuntu-latest

    # Only the keystore *location* is a literal. The keystore itself and both
    # passwords come from repository secrets, and are exported into the step
    # environment by the "Restore the release signing key from secrets" step
    # below via $GITHUB_ENV.
    #
    # They are deliberately NOT set here. A pull request must never need the
    # release key - GitHub withholds secrets from fork pull requests, so
    # requiring them here would make every pull request fail before it could
    # run a single test. The two signing steps below pick a key by event type
    # and export the matching passwords.
    #
    # Nothing here may hardcode a password: this file is public, so a literal
    # would hand every reader the key to sign updates.
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (JDK 21)
        uses: actions/setup-java@v4
        with:
          # JDK 21 is the newest LTS that AGP 9.1.1, Gradle 9.3.1 and the
          # Robolectric runner in this repo are all verified against. Newer JDKs
          # would run the build but break the JVM test step, which is the one
          # step that is a real gate rather than advisory.
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pinned to the same version as gradle/wrapper/gradle-wrapper.properties
          # and ./gradlew. This was 'current', so CI resolved whatever Gradle
          # shipped that week while every local build used 9.3.1 — meaning a build
          # could pass here and fail on a developer's machine, or the reverse, with
          # nothing in the repository to explain the difference.
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Validate the workflow files
        run: |
          # A duplicate YAML key makes the whole workflow file invalid, and the
          # failure surfaces only as "this run likely failed because of a workflow
          # file issue" with no useful log. Catching it here turns that into a
          # readable error.
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz actionlint

          # actionlint exits non-zero when a glob matches nothing, so build the file
          # list explicitly and skip the step if the directory is somehow empty.
          mapfile -t FILES < <(find .github/workflows \( -name '*.yml' -o -name '*.yaml' \) | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No workflow files found; nothing to lint."
            exit 0
          fi
          printf 'Linting: %s\n' "${FILES[@]}"
          ./actionlint "${FILES[@]}"

      # A pull request gets a throwaway key generated inside the runner, never
      # the real one. GitHub does not expose secrets to fork pull requests, and
      # a review build has no reason to hold the key that can update every
      # installed copy of the app. This is safe because every step that
      # publishes - creating the release and updating update.json - is gated on
      # `github.event_name != 'pull_request'`, so nothing signed here is ever
      # shipped to a user.
      - name: Use an ephemeral signing key for pull requests
        if: github.event_name == 'pull_request'
        run: |
          # The DN names it explicitly so this key can never be mistaken for
          # the release key in a report or an apksigner dump.
          keytool -genkeypair -v -keystore release-key.jks \
            -storepass ci-throwaway -keypass ci-throwaway -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Throwaway Not The Release Key, O=AniSequel, C=US"
          # keytool refuses a key password under 6 characters, so the throwaway
          # value is long enough to be accepted.
          echo "STORE_PASSWORD=ci-throwaway" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=ci-throwaway" >> "$GITHUB_ENV"

      - name: Restore the release signing key from secrets
        if: github.event_name != 'pull_request'
        env:
          # Scoped to this step only: the rest of the job needs the decoded
          # keystore, never the encoded secret itself.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${STORE_PASSWORD:-anisequel123r}"
          KEY_PASS="${KEY_PASSWORD:-anisequel123r}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release-key.jks
            echo "Decoded release-key.jks from the KEYSTORE_BASE64 secret."
          else
            echo "::notice::KEYSTORE_BASE64 secret is not set. Generating release keystore with password anisequel123r."
            keytool -genkeypair -v -keystore release-key.jks \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AniSequel Official Release, O=AniSequel, C=US"
          fi

          if [ ! -s release-key.jks ]; then
            echo "::error::Failed to initialize release-key.jks."
            exit 1
          fi

          # Exported so every later step - assembleRelease above all - sees
          # the passwords without this file ever containing them.
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      # Runs for both event types. The keystore is already on disk by now -
      # either decoded from the secret or generated above - and the passwords
      # come from $GITHUB_ENV, so this works without knowing which path ran.
      - name: Validate the signing key
        run: |
          # The debug key is only used by debug builds; generate it if absent.
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Fail loudly if the signing key is unusable, rather than silently
          # shipping an APK signed with the wrong key.
          keytool -list -keystore release-key.jks -storepass "$STORE_PASSWORD" -alias upload

      - name: Resolve the release version
        id: version
        env:
          # Required by the `gh release view` probe below. Without a token that
          # call exits non-zero on auth, which made the probe report "tag is
          # free" for a tag that already existed — so every build silently
          # overwrote the same release and its APK asset instead of adding one.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag is derived from the app's own versionName so the release, the
          # Settings > About version and the update manifest all agree.
          VERSION_NAME=$(grep '^anisequelVersionName=' gradle.properties | cut -d= -f2 | tr -d ' \r' || true)
          VERSION_NAME=${VERSION_NAME:-1.0.0}

          if [ "${GITHUB_REF}" = "refs/tags/${GITHUB_REF_NAME}" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # Advance the patch number past the newest published release.
            LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo '')
            LATEST_PATCH=$(echo "${LATEST:-}" | sed -E 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*$/\3/')
            LATEST_PATCH=${LATEST_PATCH:-0}
            if echo "${LATEST:-}" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
              BASE_PATCH=$(echo "$VERSION_NAME" | cut -d. -f3)
              BASE_PATCH=${BASE_PATCH:-0}
              NEXT_PATCH=$(( LATEST_PATCH > BASE_PATCH ? LATEST_PATCH : BASE_PATCH ))
              NEXT_PATCH=$(( NEXT_PATCH + 1 ))
              VERSION_NAME="1.0.${NEXT_PATCH}"
            fi

            TAG="v${VERSION_NAME}"
          fi

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing as ${TAG}"

      - name: Warn when the baseline version has drifted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gradle.properties is what a build made *outside* CI reports as its
          # version, and Settings > About reads BuildConfig. It is not what names
          # the release - the step above derives that from the newest published
          # release - so it used to sit at 1.0.0 while releases reached 1.0.6,
          # with nothing failing in between.
          #
          # The comparison is against the newest *published* release, NOT against
          # the version this build is about to publish. Those are different
          # numbers by construction: the resolver always advances the patch, so a
          # perfectly healthy build publishing v1.0.7 from a baseline of 1.0.6
          # would warn every single time. A step that cries wolf on healthy
          # builds is worse than no step - it is noise people learn to ignore.
          # A real drift is the baseline trailing the newest release by more
          # than the one version the sync is allowed to be behind.
          BASELINE=$(grep '^anisequelVersionName=' gradle.properties | cut -d= -f2 | tr -d ' \r' || true)
          BASELINE=${BASELINE:-0.0.0}

          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo '')
          if ! echo "${LATEST:-}" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "No published release to compare against; skipping."
            exit 0
          fi
          LATEST=${LATEST#v}

          # Compare patch components as integers. String comparison gets this
          # wrong: "1.0.9" sorts *above* "1.0.10", so a project past patch 9 would
          # look infinitely out of date.
          BASELINE_PATCH=$(echo "$BASELINE" | cut -d. -f3)
          LATEST_PATCH=$(echo "$LATEST" | cut -d. -f3)
          if [ -z "${BASELINE_PATCH}" ] || [ -z "${LATEST_PATCH}" ]; then
            echo "Could not read patch numbers ('${BASELINE}' vs '${LATEST}'); skipping."
            exit 0
          fi

          if [ "$((LATEST_PATCH - BASELINE_PATCH))" -gt 1 ]; then
            echo "::warning::gradle.properties says ${BASELINE} but ${LATEST} is " \
                 "published - ${BASELINE} trails it by more than one release, so " \
                 "the manifest sync has not been running. Local builds report the " \
                 "wrong version in Settings > About."
          else
            echo "Baseline ${BASELINE} is in step with the newest release (${LATEST})."
          fi

      - name: Android Lint
        run: |
          echo "::group::Running Android Lint"
          # Advisory only, and the comment above used to claim the opposite.
          #
          # `lint { abortOnError = false }` in app/build.gradle.kts means lint
          # reports findings without failing the build, so this step would never
          # stop a release either way. It is kept because the annotations are
          # useful in the run summary, but it must not be read as a gate.
          ./gradlew lintRelease --continue || echo "::warning::lint reported issues (see annotations)"
          echo "::endgroup::"

      - name: Unit tests
        run: |
          # A real gate, not an advisory step.
          #
          # The repository carries FindMissedSequelsUseCaseTest, ExampleUnitTest and
          # ExampleRobolectricTest, and a build that only lints (advisory) and
          # assembles a release APK would ship a broken "find my missed sequels"
          # list without anyone noticing: the sequel-detection rules in
          # FindMissedSequelsUseCase are pure logic, so they are exactly the kind
          # of code that regresses silently.
          #
          # Robolectric needs to fetch its android-all jars on a cold runner, so
          # this step is the slowest in the workflow. That is still cheaper than
          # the alternative, which is finding out from a user's installed app.
          echo "::group::Running JVM unit tests"
          # `test`, not `testReleaseUnitTest`: the per-variant task is not present
          # under this AGP, and the lifecycle task runs every unit-test variant
          # that does exist, which is what is wanted here anyway.
          ./gradlew test --stacktrace
          echo "::endgroup::"

      - name: Build Release APK
        run: |
          # The version name is resolved before the build and passed in, so the
          # version compiled into the APK (shown in Settings -> About) is the
          # same one the release tag and update manifest use. Resolving it after
          # the build left the APK advertising a version that was not the one it
          # was published under.
          #
          # One universal APK, deliberately. There is no `splits` block in
          # app/build.gradle.kts, so the per-ABI branches that used to sit in
          # the artifact step below could never match anything — they were copied
          # from a template that did have ABI splits. If per-ABI artifacts are
          # actually wanted, add the `splits` block *and* keep the branches.
          ./gradlew assembleRelease \
            -PanisequelVersionCode="${{ github.run_number }}" \
            -PanisequelVersionName="${{ steps.version.outputs.version_name }}" \
            --stacktrace

      - name: Prepare APK Artifact
        run: |
          OUTPUT_DIR="release-artifacts"
          mkdir -p "$OUTPUT_DIR"

          APK_BUILD_PATH="app/build/outputs/apk/release"
          APK=$(find "$APK_BUILD_PATH" -name '*.apk' -type f | head -1 || true)

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced in $APK_BUILD_PATH"
            exit 1
          fi

          # Fail loudly rather than publishing a release with no asset attached.
          cp "$APK" "$OUTPUT_DIR/anisequel-universal.apk"

          echo "Prepared $OUTPUT_DIR/anisequel-universal.apk:"
          ls -la "$OUTPUT_DIR"

      - name: Verify APK Release Signing Integrity
        run: |
          echo "::group::Verifying APK Signature and Keystore Integrity"
          # Find apksigner binary from Android SDK build-tools
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Using apksigner at: $APKSIGNER"
            "$APKSIGNER" verify --verbose --print-certs release-artifacts/anisequel-universal.apk
            echo "APK signature successfully verified against release signing key."
          else
            echo "apksigner not found; falling back to keytool jar verification."
            keytool -printcert -jarfile release-artifacts/anisequel-universal.apk
          fi
          echo "::endgroup::"

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: anisequel-apks
          path: release-artifacts/*.apk

      - name: Tell reviewers where the APK is
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # Taken from the event payload rather than looked up.
          #
          # On a `pull_request` event `github.sha` is the *merge* commit that CI
          # built — refs/pull/N/merge — not the head commit on the branch. An
          # earlier version searched the open PRs for one whose `head.sha` equalled
          # `github.sha`, found nothing, and skipped the comment while still
          # reporting success. The number is right there in the payload.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A pull request builds a real, signed release APK and then throws it
          # away, because the two steps that publish it are guarded by
          # `github.event_name != 'pull_request'` — correctly, since a PR must
          # never mint a release or push to the update manifest.
          #
          # The consequence was that the APK existed but was unfindable: a
          # reviewer had to know to open the Actions tab, find the right run,
          # expand "Artifacts" and download a zip. So the APK is linked on the
          # PR itself, and the release steps stay exactly as guarded as they
          # were.
          #
          # Two things this step deliberately does *not* do:
          #
          #  - It does not fail the run. A comment is a courtesy; if the token
          #    cannot write one the build is still a good build, and turning a
          #    permissions quirk into a red X on an otherwise-green PR would
          #    train people to ignore this workflow's failures.
          #  - It does not post once per push. Every new commit re-runs the
          #    workflow, and a PR that has been through six pushes would
          #    otherwise carry six identical comments. The existing one is
          #    found by marker and edited in place.
          #
          # Fork pull requests get a read-only GITHUB_TOKEN by design, so the
          # write is skipped there rather than attempted and failed. The APK is
          # still in the run's artifacts either way.
          if [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "::notice::Fork pull request: GITHUB_TOKEN is read-only, so the APK"
            echo "::notice::link cannot be posted. The artifact is still uploaded to"
            echo "::notice::this run under 'anisequel-apks'."
            exit 0
          fi

          # Resolve the artifact id so the link goes straight to the APK rather
          # than to the run's artifact list, which is where a reviewer would
          # otherwise have to start. The download itself still goes through
          # GitHub's artifact UI - that is a deliberate constraint of the
          # artifact store, not something a link can bypass.
          ARTIFACT_ID=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "anisequel-apks") | .id' | head -1 || true)

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::warning::anisequel-apks artifact not found; skipping the PR comment."
            exit 0
          fi

          ARTIFACT_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}/artifacts/${ARTIFACT_ID}"
          MARKER="<!-- anisequel-apk -->"
          VERSION=$(grep '^anisequelVersionName=' gradle.properties | cut -d= -f2 | tr -d ' \r' || true)
          VERSION=${VERSION:-unknown}

          BODY=$(cat <<EOF
          ${MARKER}
          ### 📦 APK for this pull request

          This build is green, so the release APK it produced is ready to try:

          **[⬇ Download anisequel-universal.apk](${ARTIFACT_URL})**

          One universal build — it runs on every phone and tablet on Android 7
          (API 24) and above, so there is nothing to choose between. It is signed
          with the **same key as every published release**, so it installs
          straight over an existing copy of AniSequel without an uninstall first.

          *Version \`${VERSION}\`, built from \`${SHA:0:8}\` on run \`${RUN_ID}\`.
          Artifacts are kept by GitHub for 90 days.*

          This is a build of the branch, not a release. Nothing is published and
          the update manifest is untouched until this is merged into \`main\`.
          EOF
          )

          EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1 || true)

          if [ -n "$EXISTING" ]; then
            if gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING}" \
                 -f body="$BODY" > /dev/null; then
              echo "Updated the APK comment on #${PR_NUMBER}."
            else
              echo "::warning::Could not update the APK comment on #${PR_NUMBER}."
            fi
          else
            if gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
                 -f body="$BODY" > /dev/null; then
              echo "Posted the APK comment on #${PR_NUMBER}."
            else
              echo "::warning::Could not post the APK comment on #${PR_NUMBER}."
            fi
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        # Publish on every green main build, on tags, and on manual dispatch.
        # Pull requests are excluded: they must not create releases.
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: "AniSequel ${{ env.TAG }} (${{ env.VERSION_NAME }})"
          body: |
            ## AniSequel

            Find the anime sequels you finished the first season of and never got
            around to, and add them to your AniList Planning list in one tap.

            ### 📦 APK package
            **anisequel-universal.apk** runs on every supported device — there is
            only one build, so there is nothing to choose between.

            *Built from commit* `${{ github.sha }}` *on run* `${{ github.run_number }}`.

            ### 🔑 First launch
            AniSequel signs you in to your own AniList account through AniList's
            OAuth page — there is no AniSequel account and no password to manage.

            ### ⚠️ Installing over an older build
            Every release from this one onward is signed with the same key, so you
            can install future updates over the top without uninstalling first.

            If you are upgrading from **v1.0.16 or earlier**, the signing key has
            changed and Android will refuse the install — a new key can never
            update an app signed with an old one. Uninstall **AniSequel** once,
            then install this APK. This wipes the app's local data, so expect to
            sign in to AniList again.

            If Android reports **"App not installed as package conflicts"**, an
            older copy signed with a *different* key is still present. Uninstall
            **AniSequel** once, then install this APK.

            ### 🛡️ "App blocked to protect your device"
            Google Play Protect flags any app that is not published on the Play
            Store and is signed by an unrecognised developer. This is expected
            for a sideloaded build. Choose **"More details" → "Install anyway"**,
            or temporarily disable Play Protect in Play Store → Settings.

            *Built with JDK 21 and verified by Android Lint.*
          draft: false
          # Anything published from a branch other than main is a pre-release;
          # only main produces the stable builds that update.json points at.
          # Hardcoding `true` here would leave every future main release
          # flagged as a pre-release too, which is what happened the first
          # time this branch needed one.
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          generate_release_notes: true
          files: release-artifacts/*.apk

      - name: Publish the update manifest
        # Branch pushes only. On a tag build the manifest commit would be pushed
        # straight at the tag ref, moving a tag that is supposed to be immutable
        # (and re-triggering this workflow when it moved).
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Written here rather than in a separate release-triggered workflow
          # because only the build job knows the run number, and the run number
          # is the APK's real VERSION_CODE (it is passed as
          # -PanisequelVersionCode).
          #
          # Anything that compares this version_code against
          # BuildConfig.VERSION_CODE must see the same number, or every comparison
          # is false and an updater silently never offers an update.
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/anisequel-universal.apk"
          SIZE=$(stat -c%s release-artifacts/anisequel-universal.apk)

          # The release's own body, which GitHub generated from the commits and
          # merged PRs since the last release. This is what the in-app update
          # prompt shows, so it has to be prose a person can act on - the old
          # value was "Build 22 from a4171424", which tells a user deciding
          # whether to update nothing at all.
          #
          # The release step above has already run, so the body exists by now.
          # A failure here must not sink the release: fall back to the build
          # identifier that was there before.
          RELEASE_BODY=$(gh release view "${TAG}" --json body --jq '.body' 2>/dev/null || echo "")
          PUBLISHED_AT=$(gh release view "${TAG}" --json publishedAt --jq '.publishedAt' 2>/dev/null || echo "")

          if [ -z "${RELEASE_BODY//[[:space:]]/}" ]; then
            NOTES="Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::8}."
          else
            # Trailing whitespace stripped, and capped: this lands in a dialog
            # on a phone, and an unbounded generated changelog would push the
            # useful first line off the screen.
            NOTES=$(printf '%s' "${RELEASE_BODY}" \
              | tr '\r' ' ' \
              | sed -e 's/[[:space:]]*$//' -e '/./,$!d' \
              | head -c 1200)
            NOTES="${NOTES}

          Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::8}."
          fi

          # Built with jq rather than a heredoc. Release notes are free text from
          # GitHub and routinely contain quotes, backslashes and newlines; a
          # heredoc interpolation of them produces malformed JSON, and the app
          # treats a manifest it cannot parse as a failed update check.
          jq -n \
            --arg version "${VERSION_NAME}" \
            --argjson version_code "${GITHUB_RUN_NUMBER}" \
            --arg release_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --arg download_url "${ASSET_URL}" \
            --argjson size_bytes "${SIZE}" \
            --arg published_at "${PUBLISHED_AT}" \
            --arg notes "${NOTES}" \
            '{
              version: $version,
              version_code: $version_code,
              release_url: $release_url,
              download_url: $download_url,
              size_bytes: $size_bytes,
              published_at: $published_at,
              notes: $notes
            }' > update.json

          # Bring the baseline forward in the same commit, so the version a local
          # build reports can never trail the published one by more than a single
          # commit. Rewriting both lines here - rather than leaving them to be
          # bumped by hand - is what stops this file drifting again.
          #
          # app/build.gradle.kts has to be rewritten in the SAME commit. Its
          # BASELINE_VERSION_NAME/BASELINE_VERSION_CODE are a second, separate
          # copy of the version (Gradle cannot read project properties from
          # inside the script body), and VersionBaselineTest asserts the two
          # agree. Syncing only gradle.properties left the copy a version
          # behind after every single release, which is what turned main red and
          # failed every pull request opened against it - the manifest step
          # passed its own build, because that build ran before the manifest was
          # rewritten, and the mismatch only surfaced on the *next* run.
          sed -i -E "s/^anisequelVersionName=.*/anisequelVersionName=${VERSION_NAME}/" gradle.properties
          sed -i -E "s/^anisequelVersionCode=.*/anisequelVersionCode=${GITHUB_RUN_NUMBER}/" gradle.properties
          sed -i -E "s/^val BASELINE_VERSION_NAME = .*/val BASELINE_VERSION_NAME = \"${VERSION_NAME}\"/" app/build.gradle.kts
          sed -i -E "s/^val BASELINE_VERSION_CODE = .*/val BASELINE_VERSION_CODE = ${GITHUB_RUN_NUMBER}/" app/build.gradle.kts

          # Refuse to publish a state the next run would fail on. Cheaper than
          # discovering it as a red build on someone else's pull request.
          if ! grep -qE "^val BASELINE_VERSION_NAME = \"${VERSION_NAME}\"$" app/build.gradle.kts \
             || ! grep -qE "^val BASELINE_VERSION_CODE = ${GITHUB_RUN_NUMBER}$" app/build.gradle.kts; then
            echo "::error::Could not sync BASELINE_* in app/build.gradle.kts;" \
                 "VersionBaselineTest will fail on the next build."
            exit 1
          fi

          cat update.json
          grep '^anisequelVersion' gradle.properties
          grep '^val BASELINE_VERSION' app/build.gradle.kts
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json gradle.properties app/build.gradle.kts
          # --quiet: this runs on every main build, and a no-op commit must not
          # produce an empty commit that would loop the workflow.
          #
          # The loop is already impossible regardless of paths-ignore: this
          # pushes with GITHUB_TOKEN, and GitHub does not start workflow runs
          # for token-authenticated pushes.
          git commit --quiet -m "Update manifest for ${TAG}" || echo "Manifest already current."
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}" 2>/dev/null || true
          git push --quiet origin "HEAD:${GITHUB_REF_NAME}" || echo "Nothing to push."