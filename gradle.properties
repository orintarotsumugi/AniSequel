# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# 6g, not the 4g this shipped with, because GitHub's ubuntu-latest runner has
# 16 GB and R8 - the release build's dominant cost - is the part that runs out
# of heap first. The runners are the reason for the size: a developer machine
# with less memory than CI would pay for a larger value here, so this is sized
# for the slowest machine that actually runs it.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4
# Set the Kotlin compiler execution strategy to in-process to avoid "Could not
# connect to Kotlin compile daemon" error.
kotlin.compiler.execution.strategy=in-process
# Baseline version, and the fallback for builds made outside CI.
#
# This file is NOT what names a release. The workflow derives the next version
# from the newest published release and passes it back in as
# -PanisequelVersionName / -PanisequelVersionCode, which is why this value used
# to sit at 1.0.0 while releases reached 1.0.6: nothing here ever read it, and
# nothing failed when it went stale.
#
# That matters because this is what a *local* build reports. Settings > About and
# the "What's new" heading both read BuildConfig, so a debug APK built from a
# checkout said "1.0.0 (1)" - a version that does not exist and is six releases
# behind the installed app.
#
# Keep it equal to the newest published release.
#
# The comment here used to claim a workflow step "fails the build when it
# drifts, so it cannot rot again". It does not: that step emits a ::warning::
# and nothing else, which is why this sat at 1.0.14 for four releases while
# 1.0.18 was published. Two things now back the claim up:
#
#  - VersionBaselineTest fails when the committed manifest is more than one
#    version ahead of this file, which runs in the unit-test job.
#  - The workflow's manifest step rewrites this file and app/build.gradle.kts
#    together, but its commit is rejected by branch protection (GitHub does not
#    run workflows for pushes made with GITHUB_TOKEN), so the value below still
#    has to be brought forward by hand after a release.
# 1.5.9 is Ani-chan's control panel. A line can stay for 3, 5, 8 or 12 seconds,
# or until it is tapped; the pill carries a heart that saves the line on the
# device, and Settings lists saved lines in pool order and replays one as itself.
# The pool is grouped into four tones - Feelings, Backlog, Craft and Ani-chan &
# the app - each of which can be switched off, with the shuffle bag cycling only
# the selected lines, and it grew to 323. Three opt-in moments (app open, tab
# change, refresh) join the timer, each behind a quiet gap, and the arrival tick
# has a switch. Dwell, tones and moments are stored beside the old four
# preferences; saved lines are a separate flow because "Reset joke settings" must
# not delete something the reader made. The rest of the release is the waiting
# state and the artwork: covers moved out of `cacheDir` into `noBackupFilesDir`
# (and the widget's four posters onto disk with them), the Library's first load
# draws the grid it is about to fill, a cold start says it is checking for a saved
# session, the scan tab stops hiding its own button behind the keyboard, and the
# saved-copy notice lives in the top bar instead of pushing the list down twice a
# launch.
# 1.5.8 is the tier list's reading pass. The filter sheet gained a name search
# that reads the caption and AniList's English, romaji and native names, matches
# every word in any order, applies to the board, the unranked shelf and the
# export, and can be cleared without resetting the status filters. Display gained
# a name length (short, standard, full) beside the existing under/on-cover
# position, and both now reach all three renderers: the SVG writer had been
# drawing a caption under every poster regardless of either setting, the PNG put
# the score badge through the first word of an on-cover name, and its caption
# baseline was a constant rather than the font's own metrics. The joke toast draws
# from a shuffle bag, so a line cannot repeat until the pool is spent, and the
# pool grew by eighteen. Filtering builds one lowercased haystack per title
# instead of one per title per keystroke, and the SVG's per-tile candidate scan is
# one map.
#
# 1.6.0 is the orb, the jokes and the activity feed's pagination. The feed
# decided there was no next page when a page arrived shorter than it asked for,
# but it drops rows it cannot draw before the screen sees them - so one update for
# removed media could end a history that still had entries behind it. It now pages
# on AniList's own `Page.pageInfo.hasNextPage`, the signal the API's pagination
# guide names, and ends a finished feed with a line rather than a blank gap. A
# refresh over loaded rows keeps them instead of blanking to the skeleton, and a
# refresh that fails leaves a retry above the feed rather than replacing it with
# an error.
#
# The empty-state orb looked broken because it *was* frozen: the silhouette was a
# `Shape` whose only animated read lived inside `createOutline`, and a clipped
# graphics layer computes its outline once - so every empty state drew one
# arbitrary frame of the morph, which is the lopsided clover. It is drawn with
# `Modifier.drawBehind` now, so the shape is rebuilt in the draw pass and actually
# breathes, on every empty state that uses it.
#
# The joke pool went from 323 lines to 475 and gained a fifth tone: Dark, for the
# cancelled sequels, the decade-long hiatuses and the fictional deaths the hobby
# runs on. Settings gained a Mixed preset that switches every tone back on in one
# write, so the whole pool is a tap away without a sixth, drifting copy of the
# other five.
#
# 1.6.1 is the orb's second pass. 1.6.0 unfroze the silhouette, but it was
# morphing between a nine-lobed cookie and an eight-petal flower, and `Morph`
# matches curves by feature proximity - two shapes with no stable correspondence
# fold through themselves in the middle. It is the adjacent cookie/soft-burst
# pair from Material's own loading-indicator sequence now, held at each end so
# the loop reads as breathing rather than as a spinner. The orb's container and
# glyph cross-fade when the empty state changes meaning, and its one animated
# clock drives both the silhouette and the icon instead of two loops that never
# agreed. Profile > Activity and Profile > Library also share the list glyph for
# an ordinary empty list; the magnifier is only for a search or filter that
# matched nothing, which is also the first time a filtered Library says so.
anisequelVersionName=1.6.1
# 1.3.1 is a patch on 1.3.0, and it is the title page's relation row finally
# carrying the data the same page already had for its own title: `GET_MEDIA_DETAIL`
# asked for a second, much thinner set of relation node fields than the list query's
# `RELATED_NODE_FIELDS` carries, so the one screen whose job is to show you the rest
# of a franchise could name a related title and say nothing else about it - not when
# it aired, not how long it is, not what it scored, not whether it is out yet. The
# two queries now share one field list.
#
# Also: the docked bar measured the title against half its own width and ellipsized
# there (`MARRIAGETO...` with a third of the screen empty beside it) because two
# children held a `weight(1f)`; that pill is now also the way back to the top of a
# thirteen-card scroll and shows read progress; Extras can copy a title's AniList
# link, which it could not before; and the synopsis card springs open instead of
# resizing in one frame, keeping its expanded state while it is scrolled off screen.
#
# Still 1.3.1 for the follow-up rounds rather than a 1.3.2, by request. That covers
# the fix round - the Watching Progress wave drew its fill as a second path
# (different amplitude, own phase) so the coloured part floated off the track;
# `GET_MEDIA_DETAIL` never asked for `title`, which the dashboard masked by merging
# the response into the list node and the profile did not, so an Activity row opened
# as "Unknown Title"; the action row stretched its one button across the page when a
# title had no quick-add; every screen-to-screen hop pushed a duplicate on a repeat
# tap; and Settings and the profile were the two surfaces that had not been given the
# spring pass yet - and then the studio pages, which by the rule at 1.3.0 *are* a
# capability: a studio is a destination now, reachable from every credit on a title,
# with its filmography shelved by year. If a release is cut with this in it and the
# numbering is meant to say so, the honest bump is 1.4.0; that call has been left to
# whoever cuts it rather than made here.
#
# 1.3.6 carries the two title-page fixes that were meant for 1.3.5, and the
# caching round. A relation tapped inside a page opened a visibly emptier page
# than the same title opened from the list - no synopsis, no credits, and the
# relations row gone after a single hop - because the subject was built from the
# thin relation node the card carried while the detail query's answer was thrown
# away; it now resolves through the fetched detail the way an arriving row always
# did. The Watching Progress wave read its animation state during composition,
# recomposing the page around it on every frame and replaying its entrance on
# every hop; it is drawn in the draw phase now.
#
# And the part that was the ask: everything the repository cached died with the
# process, so every launch re-bought the list (one request per chunk of it), the
# viewer's own profile before it could name the account, and every title page
# already read. `SnapshotStore` keeps those answers under the cache directory,
# with the windows they always had - thirty minutes for the profile, the reader's
# refresh interval for lists and overviews, a day for a title's facts - and both
# the list cache's invalidation and sign-out take the disk copy with them.
# 1.3.8 is the app's own bar. Home, the reader's Library and their own profile
# are three pages now, switched from a floating capsule at the bottom of the
# screen - the same component the detail sheet already used, springs and all -
# and the Library left the profile for it, because a list is a statement about
# its owner and the reader's own runs to hundreds of entries. The profile's own
# pages (Home, Activity, Stats, Social) moved to the top of that screen, under
# its top bar, now that the bottom edge belongs to the app; the viewer's face in
# the bar and the avatar in the dashboard's top bar are the same tap.
# 1.5.1 puts the dashboard's one-tap Planning control on every title page. A
# title opened from the Library, a studio page or a profile now offers the same
# tap-to-plan / hold-for-watching button the recommendation cards do; a title
# already on the viewer's list draws its status instead, because AniList's add
# mutation overwrites the entry. Writes invalidate the caches they used to
# leave alone (the activity feed and the profile's stats), so the Activity tab
# shows an entry the moment it is planned rather than on the next launch.
# 1.5.2 is the answer to the previous release being too loud. The failure
# theatre the 1.5.1 API check brought with it - a broken heart, a status strip, a
# joke and a "go touch grass" off-ramp - was drawn on the app's own Profile and
# Library pages, over content the reader had just been reading; it now stays on
# the dashboard's error screen and the Settings check, and those two pages say
# what happened and offer a way back. The heartbreak itself was given a real
# performance (a double beat, a shiver, a compress, then a shockwave and debris),
# twenty more lines were added to Ani-chan's sleeping pool, and a random joke now
# turns up above the bar every few minutes. Three check bugs went with it: a
# Check tapped during a running check was silently dropped, a check that could
# not run drew the broken heart as if AniList were down, and every retry of the
# same failure repeated the same joke.
anisequelVersionCode=305

