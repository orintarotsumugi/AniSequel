# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4
# Set the Kotlin compiler execution strategy to in-process to avoid "Could not
# connect to Kotlin compile daemon" error.
kotlin.compiler.execution.strategy=in-process
# Allow the google-services plugin to work even if the google-services.json is not present.
# The plugin itself is currently disabled in build.gradle.kts (no Firebase dependency
# is live), so this line only applies again if that plugin is re-enabled.
googleServices.missing.passthrough=true
# Baseline version, and the fallback for builds made outside CI.
#
# This file is NOT what names a release. The workflow derives the next version
# from the newest published release and passes it back in as
# -PanisequelVersionName / -PanisequelVersionCode, which is why this value used
# to sit at 1.0.0 while releases reached 1.0.6: nothing here ever read it, and
# nothing failed when it went stale.
#
# That matters because this is what a *local* build reports. Settings > About and
# the "What's new" heading both read BuildConfig, so a debug APK built from a
# checkout said "1.0.0 (1)" - a version that does not exist and is six releases
# behind the installed app.
#
# Keep it equal to the newest published release.
#
# The comment here used to claim a workflow step "fails the build when it
# drifts, so it cannot rot again". It does not: that step emits a ::warning::
# and nothing else, which is why this sat at 1.0.14 for four releases while
# 1.0.18 was published. Two things now back the claim up:
#
#  - VersionBaselineTest fails when the committed manifest is more than one
#    version ahead of this file, which runs in the unit-test job.
#  - The workflow's manifest step rewrites this file and app/build.gradle.kts
#    together, but its commit is rejected by branch protection (GitHub does not
#    run workflows for pushes made with GITHUB_TOKEN), so the value below still
#    has to be brought forward by hand after a release.
anisequelVersionName=1.0.44
# The GitHub run number of the release this baseline matches is 125 (v1.0.44).
# Kept one above it so a locally built APK never advertises a lower version code
# than the release already installed on the same device - which is what the
# updater compares (see "Compare version_code, never the version string" in
# AGENTS.md). The workflow passes its own run number in for a real release.
anisequelVersionCode=126
